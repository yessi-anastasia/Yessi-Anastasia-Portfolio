tr:`my house is falling apart,  
a pipe has given way.

water keeps finding its way into every corner,  
soaking everything I once called mine.

14 turns of the clock have passed,  
the edges of those hanging photographs have begun to brown.

exhausted,  
I’m leaving for the sake of silence.

rain is falling.

to my surprise, my eyes caught a house with its door left open, right beside me.

what a relief.  
at last, somewhere I can breathe without the need of bracing myself.

it is beautiful. orderly. but strangely empty.

hmm…  
it feels as though no one has lived here  
for a long, long time.

I hum to myself,  
trying to make my own company enough.

well, what could I even guess?  
the house echoes.

for a moment,  
the world doesn't feel quite so lonely.

but I was fallacious.

oblivious, I started leaving pieces of myself behind
a bit here,  
a tiny there,  
until the house begins to be furnished.

it’s comfortable and sound.  
I am very much sheltered here.

somehow,  
this house knows what makes me restless.

it is unfamiliar, a novelty to everything I have known,  
yet my soul settles into it as if it were meant to.

a spotless kitchen,  
though there are some footprints on the floor.

I am rotting  
where the owner did not bethink.

should I ask its owner  
if I can have the house?

ah. well.  
I'm sorry.

this was never about a house.`},

{id:"more-of-me",t:"becoming more of me",date:"7 August 2025",vis:"public",th:["writing","people"],
text:`I once had someone who would criticise my writing style
when I was still making a living from my words
I stopped writing the way I loved
I once had someone who would mock my accent
the way I spoke languages I wasn’t fluent in
I stopped speaking some of them altogether
I once dated someone who criticised the way I dressed
bet you I started dressing like the girls in his feed
changed my lip colour to something I never liked
I was told a couple of times that the body I actually loved looked weird
bet you I started covering every curve
all those times, I thought I was evolving
but really, I was just slowly disappearing
shrinking into versions they could digest
palatable, silent, an apologetic version of me
now I gained myself back
through the unkind
through all the begging
learning to unlove these people I used to swear to live for
to stop loving the ones who made me small
in that very unloved space
I started making room for me again
turns out the cliche is true
we are what we love
thus I loved them, I became less
now that I love me,
I am becoming more of me.
ask me not about why I stopped writing,
or why I no longer speak Mandarin or Deutsch
the people I loved looked happier
when I shut my mouth and mind.`},
{id:"girlhood",t:"girlhood 🤍",date:"8 March 2026",vis:"public",th:["writing","community","people","culture"],
text:`younger me always gravitated toward what felt light
easier, filled with laughter.
simpler dynamics,
less reading between the lines,
less emotional politics.
a life where I didn’t have to keep pace with womanhood.
yet came the years
when I learned to choose myself,
gently loosening my grip
on the little girl who was endlessly ambitious.
I’d always had glimpses of it,
but in these past years,
I found my way to the sisters I’d always longed for.
above all, I feel accepted
no reasoning demanded for my beliefs,
no value or worth to prove,
no timeline I’m due to meet,
no fitting in, no reshaping.
life still moves.
I’m just no longer running.
and along the way,
life led me
to the most exciting journey of all
girlhood.
Selamat hari kartini
女人能頂半邊天`},
{id:"numerical",t:"A NUMERICAL LOT",date:"30 April 2026",vis:"public",th:["writing","storytelling"],

when did this all become math?

var AU=["I came to Australia partly because I wanted to find out what I was capable of outside the version of myself I already knew.","So I worked.","In kitchens. On farms. In grain operations. Behind counters. At events. In food production.","Some jobs were practical. Some were temporary. Some were completely outside my previous career.","But I was paying attention.","To people. To systems. To pressure. To customers. To what kind of work gives me energy. To what I don’t want.","And to what I’d do as me.","Australia became less of a career detour and more of a self-experiment."];
var AB=["Working across Australian agriculture, food production and hospitality changed the way I think about business.","Before Australia, much of my experience was on the marketing and business side, thinking about customers, communication, positioning and opportunities.","Here, I got to work much closer to the actual operation.","I handled products. I followed standards. I worked in kitchens. I served customers. I worked alongside production systems.","I saw what happens when things get busy.","I started understanding business from the other direction:","What happens before the customer ever sees the product?","That changed how I think about quality, operations and customer experience.","A product doesn’t enter an empty space.","It enters a society.","And society shapes expectations.","The way people communicate. The way they queue. The way they complain. The way they ask for help. The way they interpret friendliness. The way they respond to brands.","Experience is not created by a business alone.","It is created collectively. By the business, the people working inside it, the customer, and the culture surrounding them."];
